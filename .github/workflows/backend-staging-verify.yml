# Run only AFTER the staging applications have been manually Synced and verified.
name: Verify staging image for promotion
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full backend dev commit SHA tested on EKS
        required: true
        type: string
      image_tag:
        description: Tested GHCR tag (stag-<sha7>-<YYYYMMDD>)
        required: true
        type: string
      eks_verified:
        description: Auth, Guidebook and Scheduler have been Synced and verified on EKS
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: staging-verify-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.eks_verified && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_TAG" =~ ^stag-${SOURCE_SHA:0:7}-[0-9]{8}$ ]]
      - name: Require successful staging workflow
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'backend-staging-ci-cd.yml',
              head_sha: process.env.SOURCE_SHA,
              branch: 'dev', event: 'push', status: 'success', per_page: 1
            });
            if (!data.workflow_runs.length) {
              core.setFailed('No successful staging CI/GitOps workflow for this commit.');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image revision and issue tree tag
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ktb4-10-be"
          IMAGE_URI="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$IMAGE_URI"
          REVISION=$(docker image inspect "$IMAGE_URI" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$REVISION" != "$SOURCE_SHA" ]; then
            echo '::error::Image revision does not match the verified source SHA.'
            exit 1
          fi
          # Retag the exact digest inspected, rather than a tag which could move.
          DIGEST_URI=$(docker image inspect "$IMAGE_URI" --format '{{ index .RepoDigests 0 }}')
          TREE=$(git rev-parse 'HEAD^{tree}' | cut -c1-12)
          docker buildx imagetools create -t "${IMAGE_NAME}:tree-${TREE}" "$DIGEST_URI"
          echo "Verified promotion tag: ${IMAGE_NAME}:tree-${TREE}" >> "$GITHUB_STEP_SUMMARY"
