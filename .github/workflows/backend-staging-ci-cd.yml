# dev -> CI -> GHCR -> GitOps. EKS deployment remains a manual Argo CD Sync.
name: KGB Backend CI/CD (staging)

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backend-cd-stag
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant Gradle Permission
        run: chmod +x gradlew
      - name: Gradle Build
        run: ./gradlew build
      - name: Checkstyle
        run: ./gradlew checkstyleMain
      - name: SpotBugs
        run: ./gradlew spotbugsMain

  backend-cd-stag:
    name: Build staging image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ktb4-10-be"
          TAG="stag-${GITHUB_SHA:0:7}-$(TZ=Asia/Seoul date +%Y%m%d)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

  update-gitops:
    name: Update staging GitOps image tags
    needs: backend-cd-stag
    runs-on: ubuntu-latest
    steps:
      - name: Check GitOps credential
        env:
          GITOPS_TOKEN: ${{ secrets.KGB_GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::KGB_GITOPS_TOKEN is required (Cloud repository Contents: read/write)."
            exit 1
          fi
      - name: Checkout backend scripts
        uses: actions/checkout@v4
        with:
          path: backend
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: 100-hours-a-week/KTB4-10th-Cloud
          ref: main
          token: ${{ secrets.KGB_GITOPS_TOKEN }}
          path: gitops
      - name: Update and push image tags
        id: update
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.backend-cd-stag.outputs.tag }}
        run: |
          set -euo pipefail
          git -C gitops config user.name 'github-actions[bot]'
          git -C gitops config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # A newer dev merge must not be overwritten by a delayed older run.
            git -C backend fetch origin dev
            if [ "$(git -C backend rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
              echo "Newer dev commit exists; skipping this GitOps update."
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Reapply only the three image tags on top of the latest Cloud main.
            git -C gitops fetch origin main
            git -C gitops checkout -B staging-image-update FETCH_HEAD
            python3 backend/.github/scripts/update-staging-image.py gitops "$IMAGE_TAG"
            git -C gitops add -- helm/auth/values.yaml helm/guidebook/values.yaml helm/scheduler/values.yaml
            if git -C gitops diff --cached --quiet; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C gitops commit -m "chore(staging): update backend image to ${IMAGE_TAG}" -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            if git -C gitops push origin HEAD:main; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/3); fetching the latest branch before retry."
          done
          echo '::error::Unable to update GitOps main. Check token permissions, branch rules and concurrent changes.'
          exit 1
      - name: Write delivery summary
        env:
          IMAGE_URI: ${{ needs.backend-cd-stag.outputs.uri }}
          UPDATED: ${{ steps.update.outputs.updated }}
        run: |
          {
            echo '### Staging image delivery'
            echo "- Image: ${IMAGE_URI}"
            echo "- GitOps changed: ${UPDATED}"
            echo '- Target: Cloud main / helm/{auth,guidebook,scheduler}/values.yaml'
            echo '- EKS deployment: pending manual Argo CD Sync and health verification.'
            echo '- No verified tree tag is issued by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
