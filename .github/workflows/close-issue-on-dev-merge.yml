name: Close Issue on dev merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close the branch-linked Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          issue_number="$(printf '%s' "$HEAD_REF" | sed -nE 's#^(feat|fix|refactor|test|docs|chore|ci)/([0-9]+)-.*#\2#p')"

          if [[ -z "$issue_number" ]]; then
            echo "No Issue number found in branch: $HEAD_REF"
            exit 0
          fi

          if ! printf '%s' "$PR_BODY" | grep -Eiq "(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?) +#$issue_number([^0-9]|$)"; then
            echo "PR body does not explicitly close #$issue_number"
            exit 0
          fi

          state="$(gh issue view "$issue_number" --json state --jq .state)"
          if [[ "$state" == "OPEN" ]]; then
            gh issue close "$issue_number" --reason completed \
              --comment "PR #$PR_NUMBER가 dev에 병합되어 자동으로 완료 처리합니다."
          else
            echo "Issue #$issue_number is already $state"
          fi
