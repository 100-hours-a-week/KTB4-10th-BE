name: KGB Backend CI/CD

on:
  # feature -> dev / dev -> main PR
  pull_request:
    branches:
      - dev
      - main

  # main Merge 이후 CI/CD 실행
  push:
    branches:
      - main

# GitHub Actions 권한
permissions:
  contents: read
  packages: write

  # GitHub OIDC -> AWS IAM Role Assume에 필요
  id-token: write


jobs:
  # PR 검증
  # ==================================================
  pr-ci:
    name: PR CI

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:

      # Repository Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle Wrapper 실행 권한
      - name: Grant Gradle Permission
        run: chmod +x gradlew

      # Build / Compile 검증
      # 실패 시 Merge 차단
      - name: Gradle Build
        run: ./gradlew build

      # Checkstyle
      # 위반 내용 표시
      # Merge 차단 X
      - name: Checkstyle
        run: ./gradlew checkstyleMain

      # SpotBugs
      # Rank 5~20 제외
      # Rank 1~4 발견 시 실패
      - name: SpotBugs
        run: ./gradlew spotbugsMain

      # Dependency Review
      # 새롭게 추가/변경된 Dependency 대상
      # High 이상 취약점 발견 시 실패
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Docker Image Build 검증
      # dev -> main PR에서만 실행
      # Image Push X
      - name: Docker Build Test
        if: github.base_ref == 'main'
        run: docker build -t backend:ci .


  
  # main Merge 이후 실제 배포 Image 생성
  # ==================================================
  build-image:
    name: Build and Push Image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # 생성한 IMAGE_TAG를 deploy Job으로 전달
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:

      # Merge 완료된 main Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR Login
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image Tag 생성
      # 형식: Commit SHA 앞 7자리-생성일
      # 예: a81c29f-20260918
      - name: Generate Image Tag
        id: image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d)
          echo "tag=${SHORT_SHA}-${DATE}" >> "$GITHUB_OUTPUT"

      # 실제 배포용 Docker Image Build
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ktb4-10-be:${{ steps.image.outputs.tag }} \
            .

      # GHCR Push
      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ktb4-10-be:${{ steps.image.outputs.tag }}


  
  # Backend EC2 배포
  # ==================================================
  deploy:
    name: Deploy Backend

    # Image Build / Push 성공 이후 실행
    needs: build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # GitHub OIDC를 통해 AWS IAM Role
      # credential 직접 저장방식에서 변화
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      
      # SSM을 통해 Backend EC2에 배포 명령 전달
      # ==================================================
      - name: Send Deploy Command
        id: deploy

        env:
          # build-image Job에서 생성한 Image Tag
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}

          # GHCR Repository Owner
          GHCR_OWNER: ${{ github.repository_owner }}

          # Private GHCR Pull 인증
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ecb626c01830b39b" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"cd /opt/kgb\",
              \"echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin\",
              \"GHCR_OWNER=${GHCR_OWNER} IMAGE_TAG=${IMAGE_TAG} docker compose pull backend\",
              \"GHCR_OWNER=${GHCR_OWNER} IMAGE_TAG=${IMAGE_TAG} docker compose up -d backend\",
              \"docker compose ps backend\",
              \"for i in {1..12}; do if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi; sleep 5; done; exit 1\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      
      # SSM 명령 완료 대기
      # ==================================================
      - name: Wait for Deploy Command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0ecb626c01830b39b"

      
      # 배포 결과 확인
      # ==================================================
      - name: Check Deploy Result
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0ecb626c01830b39b" \
            --query "Status" \
            --output text)

          echo "Deploy status: ${STATUS}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Backend deployment failed."
            exit 1
          fi

          echo "Backend deployment succeeded."