#CI-CD 변경
#최종 Push때에만 해당 파이프라인 작동, lint 검사또한 진행
name: KGB Backend CI/CD

on:
  # main Merge 이후 CI/CD 실행
  push:
    branches:
      - main


# GitHub Actions 권한
permissions:
  contents: read
  packages: write

  # GitHub OIDC -> AWS IAM Role Assume에 필요
  id-token: write


jobs:

  # 1. main Merge 이후 CI 검증
  # ==================================================
  ci:
    name: CI

    runs-on: ubuntu-latest

    steps:

      # Repository Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle Wrapper 실행 권한
      - name: Grant Gradle Permission
        run: chmod +x gradlew

      # Build / Compile 검증
      # 실패 시 Image Build / 배포 차단
      - name: Gradle Build
        run: ./gradlew build

      # Checkstyle
      # 위반 내용 표시
      # build.gradle의 ignoreFailures = true 적용 시 CI 차단 X
      - name: Checkstyle
        run: ./gradlew checkstyleMain

      # SpotBugs
      # Rank 5~20 제외
      # Rank 1~4 발견 시 실패
      - name: SpotBugs
        run: ./gradlew spotbugsMain


  # 2. 실제 배포용 Docker Image 생성 및 GHCR Push
  # ==================================================
  build-image:
    name: Build and Push Image

    # CI 성공 이후 실행
    needs: ci

    runs-on: ubuntu-latest

    # 생성한 IMAGE_TAG를 CD Job으로 전달
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:

      # Merge 완료된 main Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR Login
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image Tag 생성
      # 형식: Commit SHA 앞 7자리-생성일
      # 예: a81c29f-20260921
      - name: Generate Image Tag
        id: image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d)
          echo "tag=${SHORT_SHA}-${DATE}" >> "$GITHUB_OUTPUT"

      # 실제 배포용 Docker Image Build
      # Docker Build 자체가 실패하면 이후 Push / CD 차단
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ktb4-10-be:${{ steps.image.outputs.tag }} \
            .

      # GHCR Push
      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ktb4-10-be:${{ steps.image.outputs.tag }}


 
  # 3. Backend EC2 배포
  # ==================================================
  deploy:
    name: CD

    # Image Build / Push 성공 이후 실행
    needs: build-image

    runs-on: ubuntu-latest

    steps:

      # GitHub OIDC를 통해 AWS IAM Role Assume
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2


      
      # SSM을 통해 Backend EC2에 배포 명령 전달
      # ==================================================
      - name: Send Deploy Command
        id: deploy

        env:
          # build-image Job에서 생성한 Image Tag
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}

          # GHCR Repository Owner
          GHCR_OWNER: ${{ github.repository_owner }}

          # Private GHCR Pull 인증
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ecb626c01830b39b" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"cd /opt/kgb\",
              \"echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin\",
              \"GHCR_OWNER=${GHCR_OWNER} IMAGE_TAG=${IMAGE_TAG} docker compose pull backend\",
              \"GHCR_OWNER=${GHCR_OWNER} IMAGE_TAG=${IMAGE_TAG} docker compose up -d backend\",
              \"docker compose ps backend\",
              \"for i in {1..12}; do if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi; sleep 5; done; exit 1\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"


      
      # SSM 명령 완료 대기
      # ==================================================
      - name: Wait for Deploy Command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0ecb626c01830b39b"


      # 배포 결과 확인
      # ==================================================
      - name: Check Deploy Result
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0ecb626c01830b39b" \
            --query "Status" \
            --output text)

          echo "Deploy status: ${STATUS}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Backend deployment failed."
            exit 1
          fi

          echo "Backend deployment succeeded."