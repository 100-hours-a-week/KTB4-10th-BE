name: 테스트
description: 테스트 추가·개선 작업을 등록합니다.
title: "[테스트][영역] "
labels: [test]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 검증이 부족한 규칙과 테스트가 필요한 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: target
    attributes: {label: 검증 대상, description: 대상 기능, 계층, 테스트 유형을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: 추가·수정할 테스트를 체크리스트로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scenarios
    attributes: {label: 핵심 시나리오, description: 정상, 실패, 경계, 중복·동시성 시나리오를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 실행 명령과 기대 결과를 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: 실행 시간, fixture, DB, CI와 문서 영향을 작성해 주세요.}
    validations: {required: true}
