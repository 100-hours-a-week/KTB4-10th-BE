name: 버그
description: 재현 가능한 문제와 수정 조건을 등록합니다.
title: "[bug][domain] "
labels: [bug]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 수정 이유와 사용자·서비스 영향을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: 재현 방법, description: 동일한 문제를 재현할 수 있도록 순서대로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 기대 동작}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: 실제 동작, description: 토큰, 비밀정보, 개인정보를 포함하지 마세요.}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: 실행 환경, description: 브랜치, commit SHA, local/dev 환경, DB 버전 등을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      value: |
        - [ ] 재현 테스트 작성 및 수정 전 실패 확인
        - [ ] 문제 수정 및 수정 후 성공 확인
        - [ ] 유사 경로 점검
        - [ ] 관련 문서 갱신
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 수정 완료를 판단할 검증 가능한 조건을 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 관련 ID가 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: 사용자, API, 데이터, 관련 기능과 문서 영향을 작성해 주세요.}
    validations: {required: true}
