name: 버그 신고
description: 재현 가능한 문제를 등록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 현재 발생하는 문제와 영향을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 동일한 문제를 재현할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. 로그인한다.
        2. 가이드북 생성 요청을 두 번 보낸다.
        3. 생성권이 두 번 차감되는지 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 기대하는 결과를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 발생한 결과와 오류 메시지를 작성해 주세요. 토큰이나 개인정보는 첨부하지 마세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브랜치, 커밋, 실행 환경 등 재현에 필요한 정보를 작성해 주세요.
      placeholder: main / commit SHA / local 또는 dev

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 회원, 결제, 생성권, 데이터 정합성 등에 미치는 영향을 작성해 주세요.

