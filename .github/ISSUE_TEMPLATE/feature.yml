name: 기능 개발
description: 새로운 기능이나 개선 작업을 등록합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 이 작업이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: 사용자가 가이드북 생성 상태를 확인할 수 있어야 합니다.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 작업 내용
      description: 구현할 동작을 체크리스트로 작성해 주세요.
      value: |
        - [ ] 정상 흐름 구현
        - [ ] 권한 및 입력값 검증
        - [ ] 실패·중복·경계 흐름 처리
        - [ ] 테스트 추가
        - [ ] 관련 문서 갱신
    validations:
      required: true

  - type: input
    id: requirement-ids
    attributes:
      label: 관련 요구사항 ID
      description: 관련된 FR, BR, NFR 또는 결정 항목을 작성해 주세요. 없다면 '해당 없음'으로 작성합니다.
      placeholder: FR-GDE-01, BR-GDE-02
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 리뷰어가 완료 여부를 판단할 수 있는 검증 가능한 조건을 작성해 주세요.
      placeholder: |
        - 정상 요청은 202와 작업 ID를 반환한다.
        - 동일 멱등 키 요청은 기존 작업을 반환한다.
        - 최종 실패 시 생성권을 차감하지 않는다.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 화면, API, 문서, 대안 또는 주의사항을 작성해 주세요.

