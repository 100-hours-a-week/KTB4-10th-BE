name: 문서
description: 문서 추가·수정·동기화 작업을 등록합니다.
title: "[docs][domain] "
labels: [documentation]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 현재 문서의 문제와 갱신 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: source-of-truth
    attributes: {label: 기준 자료, description: 요구사항, 코드, API, Figma 등 판단 기준을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: 추가·수정·폐기할 문서와 섹션을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 문서 간 일관성과 링크·예시의 정확성을 검증할 조건을 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: 요구사항, API, ERD, 테크스펙, Figma와 코드 동기화 영향을 작성해 주세요.}
    validations: {required: true}
