name: 리팩터링
description: 외부 동작을 바꾸지 않는 구조 개선을 등록합니다.
title: "[리팩터링][영역] "
labels: [refactor]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 현재 구조의 문제와 개선 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: invariants
    attributes: {label: 보존할 동작, description: 전후에 달라지지 않아야 할 API, 데이터, 상태 전이를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: 포함 범위와 비범위를 체크리스트로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 동작 보존과 구조 개선을 검증할 조건을 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: API, 데이터, 관련 기능과 문서 영향을 작성해 주세요.}
    validations: {required: true}
