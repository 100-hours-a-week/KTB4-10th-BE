name: 작업
description: 빌드, 설정, 의존성, 유지보수 작업을 등록합니다.
title: "[작업][영역] "
labels: [chore]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 현재 문제와 작업이 필요한 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: 변경할 설정, 도구, 의존성을 체크리스트로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: verification
    attributes: {label: 검증 방법, description: 빌드, 실행, 설정 적용 결과를 확인할 방법을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: 빌드, 런타임, 배포, 보안, 관련 기능과 문서 영향을 작성해 주세요.}
    validations: {required: true}
