spring:
  application:
    name: kgb

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 120s
  prometheus:
    metrics:
      export:
        enabled: true

notification:
  sse:
    connection-timeout: ${NOTIFICATION_SSE_CONNECTION_TIMEOUT:25m}
    reconnect-time-millis: ${NOTIFICATION_SSE_RECONNECT_TIME_MILLIS:3000}
    heartbeat-interval-millis: ${NOTIFICATION_SSE_HEARTBEAT_INTERVAL_MILLIS:15000}
    max-connections-per-member: ${NOTIFICATION_SSE_MAX_CONNECTIONS_PER_MEMBER:5}

webpush:
  vapid:
    public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${WEB_PUSH_VAPID_SUBJECT:}
  executor:
    core-pool-size: ${WEB_PUSH_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WEB_PUSH_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WEB_PUSH_EXECUTOR_QUEUE_CAPACITY:100}
  delivery:
    max-attempts: ${WEB_PUSH_MAX_ATTEMPTS:3}
    initial-backoff: ${WEB_PUSH_INITIAL_BACKOFF:1s}
    max-backoff: ${WEB_PUSH_MAX_BACKOFF:10s}
