spring:
  config:
    activate:
      on-profile: loadtest

load-test:
  user-count: ${LOAD_TEST_USER_COUNT:40}
  credit-balance: ${LOAD_TEST_CREDIT_BALANCE:100}
  session-prefix: ${LOAD_TEST_SESSION_PREFIX:k6-local-session-}

auth:
  session:
    idle-timeout: ${LOAD_TEST_SESSION_IDLE_TIMEOUT:30d}
