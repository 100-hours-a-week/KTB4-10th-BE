spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  session:
    redis:
      namespace: ${REDIS_SESSION_NAMESPACE:kgb:prod:oauth:session}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

notification:
  redis:
    enabled: ${NOTIFICATION_REDIS_ENABLED:true}
    channel: ${NOTIFICATION_REDIS_CHANNEL:kgb:prod:notification:sse}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:10s}

tour-api:
  collection:
    snapshot-location: ${TOUR_API_SNAPSHOT_LOCATION:s3://kgb-s3-storage/tour-api/raw}
map:
  common-cache-enabled: ${MAP_COMMON_CACHE_ENABLED:true}
  common-cache-preload-enabled: ${MAP_COMMON_CACHE_PRELOAD_ENABLED:true}

logging:
  structured:
    format:
      console: logstash
