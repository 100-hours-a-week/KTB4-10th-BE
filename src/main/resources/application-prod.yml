spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:10s}

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "@timestamp": timestamp
