spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

map:
  common-cache-enabled: ${MAP_COMMON_CACHE_ENABLED:true}
  common-cache-preload-enabled: ${MAP_COMMON_CACHE_PRELOAD_ENABLED:true}
